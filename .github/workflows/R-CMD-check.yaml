# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
#
# NOTE: This workflow is overkill for most R packages and
# check-standard.yaml is likely a better choice.
# usethis::use_github_action("check-standard") will install it.
on:
  push:
    branches: [main, master]
  pull_request:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}

          - {os: windows-latest, r: 'release'}

          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}
          - {os: ubuntu-latest,  r: 'oldrel-2'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      CMDSTAN_VERSION: '2.39.0'

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      # The vignette is built with Quarto (VignetteBuilder: quarto)
      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, github::stan-dev/cmdstanr
          needs: check

      # CmdStan must be installed before MalReBay: installing the package
      # compiles the Stan model (except on Linux x86-64, which uses the
      # shipped precompiled binary), and the tests and vignette run it.
      # Cached per OS/arch/version, so it is only compiled on the first run.
      - name: Cache CmdStan
        id: cache-cmdstan
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/cmdstan
          key: cmdstan-${{ env.CMDSTAN_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install CmdStan
        if: steps.cache-cmdstan.outputs.cache-hit != 'true'
        run: |
          # install_cmdstan() only creates its default folder; a custom dir
          # must already exist, otherwise it stops with an error
          cmdstan_dir <- file.path(Sys.getenv("RUNNER_TEMP"), "cmdstan")
          dir.create(cmdstan_dir, recursive = TRUE, showWarnings = FALSE)
          cmdstanr::check_cmdstan_toolchain(fix = TRUE, quiet = TRUE)
          cmdstanr::install_cmdstan(
            dir     = cmdstan_dir,
            version = Sys.getenv("CMDSTAN_VERSION"),
            cores   = parallel::detectCores()
          )
        shell: Rscript {0}

      # cmdstanr reads the CMDSTAN environment variable to find CmdStan
      - name: Point cmdstanr at CmdStan
        run: echo "CMDSTAN=${RUNNER_TEMP}/cmdstan/cmdstan-${CMDSTAN_VERSION}" >> "$GITHUB_ENV"
        shell: bash

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
